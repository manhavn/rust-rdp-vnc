[package]
name = "rust-rdp-vnc-desktop"
version = "1.0.4"
edition = "2021"
description = "Rust RDP VNC — Linux desktop RDP/VNC client powered by the rust_rdp core"

[[bin]]
name = "rust-rdp-vnc"
path = "src/main.rs"

[dependencies]
rust_rdp = { path = "../rust_rdp" }
eframe = { version = "0.31", default-features = true }
egui = "0.31"
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
directories = "5"
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11-dl = "2.21"
